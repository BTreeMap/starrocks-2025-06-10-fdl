name: Compile StarRocks

on:
  push:
    branches: [ fdl-perf ]

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 8G
  CCACHE_COMPRESS: "1"
  CCACHE_BASEDIR: /root/starrocks

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/build.sh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Pull StarRocks dev-env image
        run: docker pull starrocks/dev-env-ubuntu:latest  # Replace with your branch's image, e.g., starrocks/dev-env-ubuntu:3.2-latest

      - name: Compile StarRocks in Docker
        run: |
          docker run \
            -v $(pwd)/starrocks-3.5.1:/root/starrocks \
            -v ${{ github.workspace }}/starrocks-3.5.1:/root/starrocks \
            -v ${{ env.CCACHE_DIR }}:/root/.ccache \
            -v ~/.m2:/root/.m2 \
            -e CCACHE_DIR=/root/.ccache \
            -e CCACHE_MAXSIZE=${{ env.CCACHE_MAXSIZE }} \
            -e CCACHE_COMPRESS=${{ env.CCACHE_COMPRESS }} \
            -e CCACHE_BASEDIR=${{ env.CCACHE_BASEDIR }} \
            --name starrocks-build \
            starrocks/dev-env-ubuntu:latest \
            /bin/bash -c "cd /root/starrocks && BUILD_TYPE=Debug ./build.sh -j $(nproc) && ccache -s"

      - name: Archive build artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: starrocks-build-output
          path: /root/starrocks/output
